[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
env_logger = "0.10"
dotenv = "0.15"
log = "0.4"
actix-cors = "0.6"
sea-orm = { version = "1.1.12", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros"] }
serde = { version = "1", features = ["derive"] }
derive_more = "2.0.1"
serde_json = "1"
jsonwebtoken = "9.3.1"
bcrypt = "0.17.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.31"

